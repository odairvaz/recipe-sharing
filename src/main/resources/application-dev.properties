# Local development profile: works out of the box with `docker compose up -d postgres redis mailpit`.
# Activate with SPRING_PROFILES_ACTIVE=dev (or -Dspring-boot.run.profiles=dev).

datasourceUrl=jdbc:postgresql://localhost:5432/recipe_sharing
datasourceUsername=postgres
datasourcePassword=postgres

logDir=./logs
storageBaseLocation=./uploads

# Mailpit (SMTP on 1025, web UI on http://localhost:8025)
mailHost=localhost
mailPort=1025
mailUsername=
mailPassword=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

spring.thymeleaf.cache=false
